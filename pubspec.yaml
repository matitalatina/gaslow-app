name: gaslow_app
description: GasLow App
version: 1.4.10+39

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_redux: ^0.10.0
  redux_thunk: ^0.4.0
  url_launcher: ^6.3.2
  location: ^8.0.1
  intl: ^0.20.2
  geocoding: ^4.0.0
  http: ^1.6.0
  google_maps_flutter: ^2.14.2
  google_mobile_ads: ^7.0.0
  shared_preferences: ^2.5.4
  firebase_analytics: ^12.1.2
  #esys_flutter_share: ^1.0.2
  in_app_review: ^2.0.11
  share_plus: ^12.0.1
  get_it: ^9.2.1
  rate_my_app: ^2.3.2
  animated_text_kit: ^4.3.0
  scroll_to_index: ^3.0.1

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  test: ^1.29.0

# For information on the generic Dart part of this file, see the
# following page: https://www.dartlang.org/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  fonts:
    - family: WorkSans
      fonts:
        - asset: fonts/WorkSans-Regular.ttf
        - asset: fonts/WorkSans-Bold.ttf
          weight: 700
    - family: Syncopate
      fonts:
        - asset: fonts/Syncopate-Regular.ttf
        - asset: fonts/Syncopate-Bold.ttf
          weight: 700

  assets:
    - assets/station_logos/
    - assets/secrets.yml

# To update icons:
# flutter pub pub run flutter_launcher_icons:main
flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
